[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-client"
version = "0.7.4"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=1.50,<4", "python-dotenv>=1,<2", "httpx>=0.27,<1", "ddgs>=9.16,<10", "Pillow>=12,<13", "pypdf>=6,<7", "Pygments>=2.19,<3", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
web = ["streamlit>=1.40,<2"]
test = ["pytest>=8,<10"]
desktop = ["pywebview>=5,<7"]

[project.scripts]
local-agent = "local_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["local_agent*"]

[tool.setuptools.package-data]
local_agent = ["ui/*.html", "ui/*.ico", "ui/*.png", "ui/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
